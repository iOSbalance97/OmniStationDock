name: Build libretro cores (OmniStation)

# Compila núcleos libretro desde su código (Cores/Libretro/sources.json) y los publica como release
# «libretro-cores» de este repositorio. El workflow de la app los descarga de ahí (no los vuelve a
# compilar). La app ya no usa los núcleos de ManicEMU: todos salen de aquí.
# - Con JIT permanente (piden su memoria de JIT a OmniStation): Dolphin (GameCube/Wii), Azahar (3DS),
#   melonDS DS (NDS), PCSX ReARMed (PS1), PPSSPP (PSP), Mupen64Plus-Next (N64) y Flycast (Dreamcast).
# - Sin JIT: Nestopia (NES), Snes9x (SNES), Gambatte (GB/GBC), mGBA y gpSP y VBA-M (GBA), DeSmuME
#   (NDS), Beetle PSX HW (PS1) y Flycast sin JIT (Dreamcast, cuando no hay JIT).
# «sin_jit_todos» compila todos los sin JIT seguidos en una sola ejecución y publica una vez.
# Tarda bastante (de 10 a 90 min de Mac según el núcleo): lánzalo solo cuando quieras un núcleo nuevo.
on:
  workflow_dispatch:
    inputs:
      core:
        description: "Núcleo"
        type: choice
        options:
          - sin_jit_todos
          - dolphin
          - azahar
          - melondsds
          - pcsx_rearmed
          - ppsspp
          - mupen64plus_next
          - flycast
          - nestopia
          - snes9x
          - gambatte
          - mgba
          - gpsp
          - vbam
          - desmume
          - beetle_psx_hw
          - flycast_jitless
        default: sin_jit_todos

permissions:
  contents: write

concurrency:
  group: libretro-cores
  cancel-in-progress: false

jobs:
  # Un núcleo (los de JIT permanente, con sus submódulos, o cualquiera de los otros).
  core:
    if: inputs.core != 'sin_jit_todos'
    runs-on: macos-26
    timeout-minutes: 150
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CORE: ${{ inputs.core }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read pinned source
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          info = json.loads(Path('Cores/Libretro/sources.json').read_text())[os.environ['CORE']]
          assert info['repository'].startswith('https://github.com/')
          assert re.fullmatch('[0-9a-f]{40}', info['revision'])
          repo = info['repository'].removeprefix('https://github.com/').removesuffix('.git')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('repository=' + repo, file=output)
              print('revision=' + info['revision'], file=output)
              print('framework=' + info['framework'], file=output)
              # Sin submódulos (Mupen64Plus-Next trae uno roto; VBA-M, uno de Windows): git a secas.
              print('submodules=' + ('recursive' if info.get('submodules', True) else 'false'), file=output)
          PY

      - name: Checkout core source
        if: steps.source.outputs.submodules != 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.revision }}
          path: .native-sources/${{ inputs.core }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout core source (git, sin submódulos)
        if: steps.source.outputs.submodules == 'false'
        env:
          REPO: ${{ steps.source.outputs.repository }}
          REV: ${{ steps.source.outputs.revision }}
        run: bash Cores/Libretro/fetch_source.sh "$REPO" "$REV" ".native-sources/$CORE"

      - name: Select Xcode and tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          # Lo mismo que instala el workflow de iOS de cada núcleo (Azahar lo trae todo dentro).
          if [ "$CORE" = "dolphin" ]; then brew install cmake mbedtls zlib || true; fi
          cmake --version
          bash -n Cores/Libretro/build_core.sh

      - name: Compile core
        run: bash Cores/Libretro/build_core.sh "$CORE" ".native-sources/$CORE"

      - name: Package core
        run: bash Cores/Libretro/package_core.sh "$CORE" "${{ steps.source.outputs.repository }}" "${{ steps.source.outputs.revision }}"

      - name: Publish release libretro-cores
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Cores/Libretro/publish_release.sh

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: libretro-${{ inputs.core }}-logs
          path: build/libretro-${{ inputs.core }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Todos los sin JIT seguidos (ninguno tiene submódulos que hagan falta). Si uno falla, sigue con
  # los demás y publica los que salieron; al final el paso falla y dice cuáles no.
  sin_jit:
    if: inputs.core == 'sin_jit_todos'
    runs-on: macos-26
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CORES: nestopia snes9x gambatte mgba gpsp vbam desmume beetle_psx_hw flycast_jitless
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode and tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          cmake --version
          bash -n Cores/Libretro/build_core.sh

      - name: Compile and package cores
        id: build
        run: |
          set -uo pipefail
          failed=""
          built=""
          for CORE in $CORES; do
            echo "::group::$CORE"
            read -r REPO REV < <(python3 - "$CORE" <<'PY'
          import json, sys
          info = json.load(open('Cores/Libretro/sources.json'))[sys.argv[1]]
          print(info['repository'].removeprefix('https://github.com/').removesuffix('.git'), info['revision'])
          PY
          )
            DEST=".native-sources/$CORE"
            if bash Cores/Libretro/fetch_source.sh "$REPO" "$REV" "$DEST" \
               && bash Cores/Libretro/build_core.sh "$CORE" "$DEST" \
               && bash Cores/Libretro/package_core.sh "$CORE" "$REPO" "$REV"; then
              built="$built $CORE"
            else
              echo "::error::No se pudo compilar $CORE (registro en el artefacto de logs)."
              failed="$failed $CORE"
            fi
            # Sitio en el disco para el siguiente.
            rm -rf "$DEST"
            echo "::endgroup::"
          done
          echo "Compilados:$built"
          echo "Fallidos:${failed:- ninguno}"
          echo "built=$built" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          [ -n "$built" ]

      - name: Publish release libretro-cores
        if: steps.build.outputs.built != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Cores/Libretro/publish_release.sh

      - name: Report failed cores
        if: steps.build.outputs.failed != ''
        run: |
          echo "::error::Fallaron:${{ steps.build.outputs.failed }}. Los demás ya están publicados."
          exit 1

      - name: Upload build logs
        if: failure() || steps.build.outputs.failed != ''
        uses: actions/upload-artifact@v4
        with:
          name: libretro-sin-jit-logs
          path: build/libretro-*/*.log
          if-no-files-found: ignore
          retention-days: 7
