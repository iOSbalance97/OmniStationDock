name: Build and Release OmniStation Dock

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project OmniStationDock.xcodeproj \
            -scheme OmniStationDock \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/OmniStationDock.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry OmniStationDock.ipa Payload
          test -s OmniStationDock.ipa
          unzip -t OmniStationDock.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="build-${GITHUB_RUN_NUMBER}"
          gh release create "$VERSION" OmniStationDock.ipa \
            --title "OmniStation Dock ${VERSION}" \
            --notes "Compilación automática de OmniStation Dock." \
            --prerelease
