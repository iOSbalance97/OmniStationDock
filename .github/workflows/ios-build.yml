
name: Build OmniStation Dock

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project OmniStationDock.xcodeproj \
            -scheme OmniStationDock \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/OmniStationDock-Simulator.zip" OmniStationDock.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniStationDock-Simulator
          path: OmniStationDock-Simulator.zip
