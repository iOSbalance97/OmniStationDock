name: OmniStationDock

options:
  bundleIdPrefix: com.omnistation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  OmniStationDock:
    type: application
    platform: iOS
    sources:
      - path: OmniStation
    settings:
      base:
        
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "21"
        PRODUCT_BUNDLE_IDENTIFIER: com.omnistation.dock
        PRODUCT_NAME: OmniStationDock
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Claves extra que no se pueden poner como INFOPLIST_KEY_ (Xcode las mezcla con las generadas).
        INFOPLIST_FILE: Config/AppInfo.plist
        INFOPLIST_KEY_CFBundleDisplayName: OmniStation Dock
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # JIT integrado (StikJIT): idevice se descarga en el workflow a Vendor/idevice.
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/idevice"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/idevice"
        OTHER_LDFLAGS: "$(inherited) -lidevice_ffi"
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - sdk: JavaScriptCore.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: SystemConfiguration.framework
