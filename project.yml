name: OmniStationDock

options:
  bundleIdPrefix: com.omnistation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Mando táctil de MeloNX (GPL-3.0, stossy11/Melo-Controller, revisión que usa MeloNX 2.7).
  MeloController:
    path: Vendor/Melo-Controller

targets:
  OmniStationDock:
    type: application
    platform: iOS
    sources:
      - path: OmniStation
    settings:
      base:
        
        MARKETING_VERSION: "0.7.1"
        CURRENT_PROJECT_VERSION: "71"
        PRODUCT_BUNDLE_IDENTIFIER: com.omnistation.dock
        PRODUCT_NAME: OmniStationDock
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Claves extra que no se pueden poner como INFOPLIST_KEY_ (Xcode las mezcla con las generadas).
        INFOPLIST_FILE: Config/AppInfo.plist
        INFOPLIST_KEY_CFBundleDisplayName: OmniStation Dock
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # JIT integrado (StikJIT): idevice se descarga en el workflow a Vendor/idevice.
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/Vendor/idevice"
        # Cabeceras de Vulkan (las baja el workflow a Vendor/Vulkan-Headers) para los núcleos de 3DS y GameCube/Wii.
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/idevice $(SRCROOT)/Vendor/Vulkan-Headers/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/idevice"
        OTHER_LDFLAGS: "$(inherited) -lidevice_ffi"
        DEAD_CODE_STRIPPING: YES
        # Núcleo de ARMSX2 integrado: puente Objective-C (OmniStation/Core).
        SWIFT_OBJC_BRIDGING_HEADER: OmniStation/Core/OmniStation-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_MODULES: YES
    dependencies:
      # Extensión de JIT: engancha StikJIT a la propia OmniStation para sus núcleos integrados.
      - target: OmniStationJITHelper
      # Donación de RAM de MeloNX 2.7: procesos de ayuda que guardan la RAM de la Switch.
      - target: OmniStationRamDonor
      - package: MeloController
        product: Melo-Controller
      - sdk: GameController.framework
      - sdk: QuartzCore.framework
      # Zip de las skins de Delta (.deltaskin) del mando táctil.
      - sdk: libz.tbd
      - sdk: UniformTypeIdentifiers.framework
      # Imagen por GPU de los núcleos libretro de PS1, N64, PSP y Dreamcast.
      - sdk: OpenGLES.framework
      - sdk: Metal.framework
      - sdk: JavaScriptCore.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: SystemConfiguration.framework

  # Extensión de JIT (proceso aparte): engancha el depurador a OmniStation con StikJIT.
  OmniStationJITHelper:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Helper
      - path: OmniStation/JIT/StikJIT
    settings:
      base:
        MARKETING_VERSION: "0.7.1"
        CURRENT_PROJECT_VERSION: "71"
        PRODUCT_BUNDLE_IDENTIFIER: com.omnistation.dock.jithelper
        PRODUCT_NAME: OmniStationJITHelper
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/JITHelperInfo.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/idevice"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/idevice"
        OTHER_LDFLAGS: "$(inherited) -lidevice_ffi"
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - sdk: JavaScriptCore.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: SystemConfiguration.framework

  # Ayudante de memoria de MeloNX 2.7 (proceso aparte): presta su límite de RAM a la partida.
  OmniStationRamDonor:
    type: app-extension
    platform: iOS
    sources:
      - path: RamDonor
    settings:
      base:
        MARKETING_VERSION: "0.7.1"
        CURRENT_PROJECT_VERSION: "71"
        PRODUCT_BUNDLE_IDENTIFIER: com.omnistation.dock.ramdonor
        PRODUCT_NAME: OmniStationRamDonor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/RamDonorInfo.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: YES
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        DEAD_CODE_STRIPPING: YES
