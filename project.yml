
name: OmniStationDock

options:
  bundleIdPrefix: com.omnistation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  OmniStationDock:
    type: application
    platform: iOS
    sources:
      - path: OmniStation
    settings:
      base:
        
        MARKETING_VERSION: "0.0.2"
        CURRENT_PROJECT_VERSION: "2"
        PRODUCT_BUNDLE_IDENTIFIER: com.omnistation.dock
        PRODUCT_NAME: OmniStationDock
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OmniStation Dock
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
